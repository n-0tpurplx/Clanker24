<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clanker24 - Live Flight Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e27; color: #e0e0e0; }
        #app { display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #1a1f3a; border-right: 2px solid #2d3561; display: flex; flex-direction: column; box-shadow: 2px 0 8px rgba(0, 0, 0, 0.3); }
        .sidebar-header { padding: 20px; background: #0f1326; border-bottom: 1px solid #2d3561; }
        .sidebar-header h1 { font-size: 1.4em; margin-bottom: 5px; color: #64b5f6; }
        .status-bar { padding: 15px 20px; background: #141929; border-bottom: 1px solid #2d3561; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; animation: pulse 1.5s infinite; }
        .status-dot.connected { background: #51cf66; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .flight-count { font-weight: bold; color: #64b5f6; }
        .flights-list { flex: 1; overflow-y: auto; padding: 10px; }
        .flight-item { background: #242a45; border: 1px solid #2d3561; border-left: 3px solid #64b5f6; padding: 12px; margin-bottom: 8px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .flight-item:hover { background: #2d334d; border-left-color: #90caf9; transform: translateX(4px); }
        .flight-item.selected { background: #1e3a5f; border-left-color: #42a5f5; box-shadow: 0 0 8px rgba(66, 165, 245, 0.3); }
        .flight-callsign { font-weight: bold; color: #64b5f6; font-size: 1.1em; margin-bottom: 4px; }
        .flight-info { font-size: 0.85em; color: #b0bec5; }
        .map-container { flex: 1; position: relative; background: #000; }
        #map { width: 100%; height: 100%; }
        .controls { position: absolute; top: 10px; right: 10px; background: rgba(10, 14, 39, 0.9); border: 1px solid #2d3561; border-radius: 4px; padding: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
        .controls button { background: #242a45; color: #64b5f6; border: 1px solid #2d3561; padding: 8px 12px; border-radius: 3px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
        .controls button:hover { background: #2d334d; border-color: #64b5f6; }
        .no-flights { display: flex; align-items: center; justify-content: center; height: 100%; color: #666; font-size: 0.95em; text-align: center; padding: 20px; }
        .leaflet-popup-content-wrapper { background: #1a1f3a !important; }
        .leaflet-popup-content { color: #e0e0e0; }
    </style>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>✈️ Clanker24</h1>
                <p>Live Flight Tracker</p>
            </div>
            <div class="status-bar">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
                <span class="flight-count" id="flight-count">0 flights</span>
            </div>
            <div class="flights-list" id="flights-list">
                <div class="no-flights">Loading flights...</div>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
            <div class="controls">
                <button id="center-btn">📍 Center Map</button>
                <button id="clear-btn">🗑️ Clear</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="./src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Clanker24</title>

    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header>
    <div class="logo">CLANKER24</div>

    <select id="airportSelect">
        <option value="IMLR">IMLR</option>
        <option value="IGRV">IGRV</option>
    </select>

    <div class="stats">0 Aircraft Online</div>
</header>

<main class="board">

    <section class="column">
        <div class="column-header">PARKED</div>
        <div class="cards" id="PARKED"></div>
    </section>

    <section class="column">
        <div class="column-header">TAXIING</div>
        <div class="cards" id="TAXIING"></div>
    </section>

    <section class="column">
        <div class="column-header">DEPARTING</div>
        <div class="cards" id="DEPARTING"></div>
    </section>

    <section class="column">
        <div class="column-header">ARRIVING / ENROUTE</div>
        <div class="cards" id="ENROUTE"></div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
